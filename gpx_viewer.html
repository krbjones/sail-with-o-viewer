<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPX Track Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e2e;
      color: #cdd6f4;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; color: #cdd6f4; }
    #header .subtitle { font-size: 12px; color: #6c7086; }
    #btn-open-unused {
      margin-left: auto;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-open-unused:hover { background: #b4d0fb; }
    #load-status { font-size: 12px; color: #6c7086; min-width: 140px; }
    #progress-wrap { display: none; align-items: center; gap: 8px; flex: 1; max-width: 280px; }
    #progress-wrap.visible { display: flex; }
    #progress-bar-bg { flex: 1; height: 6px; background: #313244; border-radius: 3px; overflow: hidden; }
    #progress-bar { height: 100%; background: #89b4fa; border-radius: 3px; width: 0; transition: width 0.1s; }
    #progress-label { font-size: 11px; color: #6c7086; white-space: nowrap; }

    /* ── Layout ── */
    #main { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* ── Sidebar ── */
    #sidebar {
      width: 290px;
      flex-shrink: 0;
      background: #181825;
      border-right: 1px solid #313244;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section { padding: 12px 14px; border-bottom: 1px solid #313244; }
    .sidebar-section h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6c7086; margin-bottom: 10px;
    }
    .date-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .date-row label { font-size: 11px; color: #a6adc8; }
    .date-row input[type="date"] {
      width: 100%; background: #313244; border: 1px solid #45475a;
      border-radius: 5px; color: #cdd6f4; padding: 5px 8px;
      font-size: 12px; color-scheme: dark;
    }
    .date-row input[type="date"]:focus { outline: none; border-color: #89b4fa; }
    .date-row input[type="time"] {
      width: 100%; background: #313244; border: 1px solid #45475a;
      border-radius: 5px; color: #cdd6f4; padding: 5px 8px;
      font-size: 12px; color-scheme: dark;
    }
    .date-row input[type="time"]:focus { outline: none; border-color: #89b4fa; }
    .date-row.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-direction: unset; }
    .date-row.two-col > div { display: flex; flex-direction: column; gap: 4px; }
    .filter-divider { height: 1px; background: #313244; margin: 8px 0; }
    .filter-btns { display: flex; gap: 6px; margin-top: 6px; }
    .btn-sm { flex: 1; padding: 6px; border: none; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; }
    #btn-apply { background: #89b4fa; color: #1e1e2e; }
    #btn-apply:hover { background: #b4d0fb; }
    #btn-showall { background: #313244; color: #cdd6f4; }
    #btn-showall:hover { background: #45475a; }
    #track-summary { font-size: 11px; color: #6c7086; margin-top: 8px; }

    #tracklist-header {
      padding: 10px 14px 6px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #tracklist-header h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6c7086;
    }
    #tracklist-header span { font-size: 11px; color: #6c7086; }
    #tracklist { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    #tracklist::-webkit-scrollbar { width: 4px; }
    #tracklist::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }

    .track-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 6px; cursor: pointer;
      transition: background 0.1s; margin-bottom: 2px;
    }
    .track-item:hover { background: #313244; }
    .track-item.active-now { background: #2a2a3e; border-left: 2px solid #f38ba8; padding-left: 6px; }
    .track-dot { width: 8px; height: 8px; border-radius: 50%; background: #89b4fa; flex-shrink: 0; }
    .track-item.active-now .track-dot { background: #f38ba8; }
    .track-info { flex: 1; min-width: 0; }
    .track-date { font-size: 12px; font-weight: 500; color: #cdd6f4; }
    .track-meta { font-size: 10px; color: #6c7086; margin-top: 1px; }
    .track-zoom {
      font-size: 11px; color: #6c7086; background: none;
      border: none; cursor: pointer; padding: 2px 4px; border-radius: 3px;
    }
    .track-zoom:hover { background: #45475a; color: #cdd6f4; }
    #no-tracks { padding: 20px; text-align: center; color: #6c7086; font-size: 12px; }

    /* Track checkbox */
    .track-cb { flex-shrink: 0; width: 14px; height: 14px; accent-color: #89b4fa; cursor: pointer; }
    .track-item.track-hidden { opacity: 0.38; }
    .track-item.track-hidden .track-dot { background: #45475a !important; }
    .track-item.track-selected { background: #1e2a3a; border-left: 2px solid #89b4fa; padding-left: 6px; }
    .track-item.track-selected .track-dot { background: #89b4fa !important; }

    /* All / None buttons */
    .tracklist-toggles { display: flex; gap: 4px; }
    .btn-tiny {
      font-size: 10px; padding: 2px 6px; border: 1px solid #45475a;
      border-radius: 4px; background: #313244; color: #a6adc8; cursor: pointer;
    }
    .btn-tiny:hover { background: #45475a; color: #cdd6f4; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Speed legend (draggable) ── */
    #speed-legend {
      position: absolute;
      bottom: 24px;
      right: 12px;
      z-index: 1000;
      background: rgba(24,24,37,0.92);
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 140px;
      cursor: grab;
      user-select: none;
    }
    #speed-legend:active { cursor: grabbing; }
    #speed-legend.dragging { opacity: 0.85; }
    .legend-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6c7086; margin-bottom: 8px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 5px;
    }
    .legend-swatch {
      width: 28px; height: 4px; border-radius: 2px; flex-shrink: 0;
    }
    .legend-row span { font-size: 11px; color: #cdd6f4; }

    /* ── Speed callout above marker ── */
    .speed-callout-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .speed-callout {
      background: rgba(10,10,18,0.95);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      line-height: 1.4;
      text-align: center;
      margin-bottom: 3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .speed-callout .kts-label { font-size: 11px; color: #a0a8c0; font-weight: 500; }
    .speed-callout-stem {
      width: 2px; height: 6px; background: rgba(255,255,255,0.4);
    }
    .anim-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    /* ── Animation bar ── */
    #anim-bar {
      background: #181825;
      border-top: 1px solid #313244;
      padding: 10px 16px 12px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #anim-top { display: flex; align-items: center; gap: 10px; }
    .anim-btn {
      background: #313244; border: none; border-radius: 6px;
      color: #cdd6f4; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; flex-shrink: 0;
    }
    .anim-btn:hover { background: #45475a; }
    #btn-play { background: #89b4fa; color: #1e1e2e; width: 36px; height: 36px; font-size: 15px; }
    #btn-play:hover { background: #b4d0fb; }
    #anim-time-display {
      font-size: 13px; font-weight: 500; color: #cdd6f4;
      min-width: 210px; text-align: center;
      background: #313244; border-radius: 6px; padding: 6px 10px;
    }
    #anim-time-display .anim-time-sub { font-size: 10px; color: #6c7086; margin-top: 1px; }
    .speed-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .speed-wrap label { font-size: 11px; color: #6c7086; }
    #speed-select {
      background: #313244; border: 1px solid #45475a;
      border-radius: 5px; color: #cdd6f4; padding: 4px 8px; font-size: 12px; cursor: pointer;
    }
    #anim-bottom { display: flex; align-items: center; gap: 8px; }
    #anim-range-start, #anim-range-end { font-size: 10px; color: #6c7086; white-space: nowrap; min-width: 70px; }
    #anim-range-end { text-align: right; }
    input[type="range"]#anim-slider {
      flex: 1; -webkit-appearance: none;
      height: 4px; background: #313244; border-radius: 2px; outline: none;
    }
    input[type="range"]#anim-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #89b4fa; cursor: pointer;
    }
    #active-count { font-size: 11px; color: #a6e3a1; min-width: 90px; text-align: right; }

    /* Splash */
    #splash {
      position: absolute; inset: 0;
      background: rgba(24,24,37,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 2000; pointer-events: none;
    }
    #splash.hidden { display: none; }
    #splash .splash-icon { font-size: 48px; }
    #splash h2 { font-size: 20px; color: #cdd6f4; }
    #splash p { font-size: 13px; color: #6c7086; text-align: center; max-width: 320px; line-height: 1.5; }
    #splash-btn {
      pointer-events: all; background: #89b4fa; color: #1e1e2e;
      border: none; border-radius: 8px; padding: 10px 24px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #splash-btn:hover { background: #b4d0fb; }

    .leaflet-container { background: #1e1e2e; }

    /* ── Basemap layers control ── */
    .leaflet-control-layers {
      background: rgba(24,24,37,0.92) !important;
      border: 1px solid #313244 !important;
      border-radius: 8px !important;
      color: #cdd6f4 !important;
      box-shadow: none !important;
    }
    .leaflet-control-layers-toggle {
      background-color: rgba(24,24,37,0.92) !important;
      border-radius: 6px !important;
      width: 32px !important; height: 32px !important;
      background-size: 18px 18px !important;
      filter: invert(1) brightness(0.8);
    }
    .leaflet-control-layers-expanded {
      padding: 8px 12px !important;
      min-width: 160px;
    }
    .leaflet-control-layers-list label {
      color: #cdd6f4 !important;
      font-size: 12px !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      padding: 3px 0 !important;
    }
    .leaflet-control-layers-separator {
      border-top: 1px solid #313244 !important;
      margin: 6px 0 !important;
    }
    .leaflet-control-layers input[type="radio"],
    .leaflet-control-layers input[type="checkbox"] { accent-color: #89b4fa; }
    .leaflet-control-layers-expanded { max-height: 420px; overflow-y: auto; }
    .leaflet-control-layers-base::before {
      content: 'BASEMAP';
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6c7086;
      margin-bottom: 4px;
    }
    .leaflet-control-layers-overlays::before {
      content: 'OVERLAYS';
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6c7086;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>⛵ Sail with O Viewer</h1>
    <div class="subtitle">Marine tracks</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <span id="progress-label">Loading…</span>
  </div>
  <div id="load-status"></div>
</div>

<div id="main">
  <div id="splash">
    <div class="splash-icon">⛵</div>
    <h2>Sail with O Viewer</h2>
    <p id="splash-status">Loading tracks…</p>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <h2>Date &amp; Time Filter</h2>
      <div class="date-row">
        <label>Date from</label>
        <input type="date" id="date-from">
      </div>
      <div class="date-row">
        <label>Date to</label>
        <input type="date" id="date-to">
      </div>
      <div class="filter-divider"></div>
      <div class="date-row two-col">
        <div>
          <label>Time from</label>
          <input type="time" id="time-from">
        </div>
        <div>
          <label>Time to</label>
          <input type="time" id="time-to">
        </div>
      </div>
      <div class="filter-btns">
        <button class="btn-sm" id="btn-apply">Apply</button>
        <button class="btn-sm" id="btn-showall">Show All</button>
      </div>
      <div class="date-row" style="margin-top:6px;">
        <label for="chk-spatial" style="cursor:pointer;">
          <input type="checkbox" id="chk-spatial" style="margin-right:5px;cursor:pointer;">
          Limit to map view
        </label>
      </div>
      <div id="track-summary"></div>
    </div>
    <div id="tracklist-header">
      <h2>Tracks</h2>
      <div style="display:flex;align-items:center;gap:6px;">
        <span id="tracklist-count"></span>
        <div class="tracklist-toggles">
          <button class="btn-tiny" id="btn-all">All</button>
          <button class="btn-tiny" id="btn-none">None</button>
        </div>
      </div>
    </div>
    <div id="tracklist">
      <div id="no-tracks">Load a folder to see tracks.</div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div id="anim-bar">
  <div id="anim-top">
    <button class="anim-btn" id="btn-to-start" title="Jump to start">⏮</button>
    <button class="anim-btn" id="btn-step-back" title="Step back 1 min">◀</button>
    <button class="anim-btn" id="btn-play">▶</button>
    <button class="anim-btn" id="btn-step-fwd" title="Step forward 1 min">▶▶</button>
    <button class="anim-btn" id="btn-to-end" title="Jump to end">⏭</button>
    <div id="anim-time-display">
      <div id="anim-time-main">──────────────</div>
      <div class="anim-time-sub" id="anim-time-sub">No tracks loaded</div>
    </div>
    <div id="active-count"></div>
    <div class="speed-wrap">
      <label>Speed</label>
      <select id="speed-select">
        <option value="60000">1 min/s</option>
        <option value="300000" selected>5 min/s</option>
        <option value="900000">15 min/s</option>
        <option value="3600000">1 hr/s</option>
        <option value="21600000">6 hr/s</option>
      </select>
    </div>
  </div>
  <div id="anim-bottom">
    <div id="anim-range-start">──</div>
    <input type="range" id="anim-slider" min="0" max="1" step="1" value="0" disabled>
    <div id="anim-range-end">──</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@4.1.2/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"></script>
<script>
// ── Speed colour scale ────────────────────────────────────────────
const SPEED_THRESHOLDS = [0.5, 2, 4, 6, 8];   // knots
const SPEED_COLORS     = ['#FF0000','#FFF000','#00FF00','#00FFFF','#0000FF','#191970'];
const SPEED_LABELS     = ['< 0.5','0.5 – 2','2 – 4','4 – 6','6 – 8','8+'];

function speedBucket(kts) {
  for (let i = 0; i < SPEED_THRESHOLDS.length; i++) {
    if (kts < SPEED_THRESHOLDS[i]) return i;
  }
  return SPEED_THRESHOLDS.length;
}

// ── Haversine distance (metres) ───────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
  const Δλ = (lon2 - lon1) * Math.PI/180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}

// ── State ─────────────────────────────────────────────────────────
let tracks         = [];        // fully parsed track objects
let visibleTracks  = [];
let allTrackMeta   = [];        // [{file, startMs, month, bbox}] — from manifest
let loadedFiles    = new Set(); // filenames already fetched & parsed
let loadedMonths   = new Set(); // month keys already fetched
let selectedTrack = null;   // track whose time range the slider shows; null = full filter range
let animTime = 0, animMin = 0, animMax = 0;
let isPlaying = false, lastRealTime = null, rafId = null;
let animSpeed = 300000;  // ms of track-time per second of real-time

// ── Map ───────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([45.4, -75.7], 10);

// ── Basemaps ──────────────────────────────────────────────────────
const basemapStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 19
});

const basemapSatellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar Geographics',
  maxZoom: 19
});

const basemapOcean = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© <a href="https://www.esri.com">Esri</a>, GEBCO, NOAA, National Geographic',
  maxZoom: 13
});

// ── Overlays ──────────────────────────────────────────────────────
const overlayNautical = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openseamap.org">OpenSeaMap</a>',
  maxZoom: 18,
  opacity: 0.9
});

const overlayOceanRef = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© Esri',
  maxZoom: 13,
  opacity: 0.85
});

// Start with Ocean/Bathymetry as default
basemapOcean.addTo(map);
overlayNautical.addTo(map);

// ── Layers control (rebuilt when chart loads) ─────────────────────
let layersControl  = null;
let chartLayer     = null;
let chartGeoRaster = null;   // keep parsed georaster so we can rebuild cheaply
let chartBgMode    = 'white'; // 'white' | 'black' | 'nodata' | 'none'
let activeBasemap  = basemapOcean;

// Per-pixel colour function — reads chartBgMode at render time so redraw() picks up changes
function chartPixelFn(vals) {
  const n = vals.length;

  // RGBA — honour alpha channel
  if (n >= 4) {
    const [r, g, b, a] = vals;
    if (a === 0) return null;
    return `rgba(${r},${g},${b},${a / 255})`;
  }

  // RGB
  if (n === 3) {
    const [r, g, b] = vals;
    if (r === null) return null;
    if (chartBgMode === 'white' && r >= 248 && g >= 248 && b >= 248) return null;
    if (chartBgMode === 'black' && r <=   7 && g <=   7 && b <=   7) return null;
    if (chartBgMode === 'nodata' && chartGeoRaster != null &&
        r === chartGeoRaster.noDataValue &&
        g === chartGeoRaster.noDataValue &&
        b === chartGeoRaster.noDataValue) return null;
    return `rgb(${r},${g},${b})`;
  }

  // Single-band grayscale
  const v = vals[0];
  if (v === null) return null;
  if (chartBgMode === 'nodata' && chartGeoRaster && v === chartGeoRaster.noDataValue) return null;
  if (chartBgMode === 'white' && v >= 248) return null;
  if (chartBgMode === 'black' && v <=   7) return null;
  const c = Math.max(0, Math.min(255, v));
  return `rgb(${c},${c},${c})`;
}

function buildLayersControl() {
  if (layersControl) layersControl.remove();

  const basemaps = {
    'Street':             basemapStreet,
    'Satellite':          basemapSatellite,
    'Ocean / Bathymetry': basemapOcean,
  };

  const overlays = { 'Nautical marks': overlayNautical, 'Ocean labels': overlayOceanRef };
  if (chartLayer) overlays['📄 Local Chart'] = chartLayer;

  layersControl = L.control.layers(
    basemaps,
    overlays,
    { position: 'topright', collapsed: true }
  ).addTo(map);

  // Inject the "Load chart" button into the expanded panel
  injectChartButton();
}

function injectChartButton() {

    const panel = document.querySelector('.leaflet-control-layers-list');
    if (!panel || document.getElementById('btn-load-chart')) return;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'border-top:1px solid #313244;margin-top:6px;padding-top:8px;';

    // Load / replace button
    const btn = document.createElement('button');
    btn.id = 'btn-load-chart';
    btn.textContent = chartLayer ? '↺ Replace chart…' : '📂 Load local chart…';
    btn.style.cssText = `
      width:100%; padding:5px 8px; font-size:11px; font-weight:600;
      background:#313244; color:#89b4fa; border:1px solid #45475a;
      border-radius:5px; cursor:pointer; text-align:left;
    `;
    btn.onmouseover = () => btn.style.background = '#45475a';
    btn.onmouseout  = () => btn.style.background = '#313244';
    btn.onclick = e => { e.stopPropagation(); loadLocalChart(); };
    wrap.appendChild(btn);

    if (chartLayer) {
      // Filename note
      const note = document.createElement('div');
      note.style.cssText = 'font-size:10px;color:#6c7086;margin-top:4px;margin-bottom:8px;';
      note.textContent = '✓ ' + (chartLayer._filename || 'Chart loaded');
      wrap.appendChild(note);

      // Opacity slider
      const opacityWrap = document.createElement('div');
      opacityWrap.style.cssText = 'margin-top:2px;';

      const opacityLabel = document.createElement('div');
      opacityLabel.style.cssText = 'display:flex;justify-content:space-between;font-size:10px;color:#a6adc8;margin-bottom:4px;';
      opacityLabel.innerHTML = '<span>Chart opacity</span><span id="chart-opacity-pct">100%</span>';

      const slider = document.createElement('input');
      slider.type  = 'range';
      slider.id    = 'chart-opacity-slider';
      slider.min   = '0'; slider.max = '1'; slider.step = '0.05';
      slider.value = String(chartLayer.options.opacity ?? 1);
      slider.style.cssText = `
        width:100%; -webkit-appearance:none; height:4px;
        background:#313244; border-radius:2px; outline:none; cursor:pointer;
      `;
      slider.oninput = e => {
        e.stopPropagation();
        const v = parseFloat(e.target.value);
        chartLayer.setOpacity(v);
        document.getElementById('chart-opacity-pct').textContent = Math.round(v * 100) + '%';
      };

      opacityWrap.appendChild(opacityLabel);
      opacityWrap.appendChild(slider);
      wrap.appendChild(opacityWrap);

      // Sync pct label on open
      setTimeout(() => {
        const pct = document.getElementById('chart-opacity-pct');
        if (pct) pct.textContent = Math.round((chartLayer.options.opacity ?? 1) * 100) + '%';
      }, 10);

      // Transparency mode selector
      const bgWrap = document.createElement('div');
      bgWrap.style.cssText = 'margin-top:8px;';

      const bgLabel = document.createElement('div');
      bgLabel.style.cssText = 'font-size:10px;color:#a6adc8;margin-bottom:4px;';
      bgLabel.textContent = 'Transparent background';

      const bgSelect = document.createElement('select');
      bgSelect.id = 'chart-bg-mode';
      bgSelect.style.cssText = `
        width:100%; padding:4px 6px; font-size:11px;
        background:#313244; color:#cdd6f4; border:1px solid #45475a;
        border-radius:5px; cursor:pointer; outline:none;
      `;
      const bgOptions = [
        { value: 'white',  label: 'White background' },
        { value: 'black',  label: 'Black background' },
        { value: 'nodata', label: 'NoData value only' },
        { value: 'none',   label: 'None (show all)' },
      ];
      bgOptions.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value;
        opt.textContent = o.label;
        if (o.value === chartBgMode) opt.selected = true;
        bgSelect.appendChild(opt);
      });
      bgSelect.onchange = e => {
        e.stopPropagation();
        chartBgMode = e.target.value;
        if (chartLayer) chartLayer.updateColors();
      };

      bgWrap.appendChild(bgLabel);
      bgWrap.appendChild(bgSelect);
      wrap.appendChild(bgWrap);
    }

    panel.appendChild(wrap);
  }, 50);
}

// ── Load local GeoTIFF chart ──────────────────────────────────────
const DEFAULT_CHART_URL = 'lac_deschennes_chart_1550_cog.tif';

async function loadChartFromUrl(url) {
  const statusEl  = document.getElementById('load-status');
  const progWrap  = document.getElementById('progress-wrap');
  const progBar   = document.getElementById('progress-bar');
  const progLabel = document.getElementById('progress-label');
  const prevStatus = statusEl.textContent;

  statusEl.textContent = '';
  progWrap.classList.add('visible');
  progBar.style.width = '10%';
  progLabel.textContent = 'Fetching chart…';

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const filename = url.split('/').pop();
    const arrayBuffer = await response.arrayBuffer();
    const fileMB = (arrayBuffer.byteLength / 1024 / 1024).toFixed(1);

    progBar.style.width = '60%';
    progLabel.textContent = 'Parsing GeoTIFF…';
    await new Promise(r => setTimeout(r, 0));

    const georaster = await parseGeoraster(arrayBuffer);

    progBar.style.width = '85%';
    progLabel.textContent = 'Building layer…';
    await new Promise(r => setTimeout(r, 0));

    if (chartLayer) map.removeLayer(chartLayer);

    chartGeoRaster = georaster;
    const tileRes  = arrayBuffer.byteLength > 30 * 1024 * 1024 ? 128 : 256;

    chartLayer = new GeoRasterLayer({
      georaster,
      opacity: 1,
      resolution: tileRes,
      pixelValuesToColorFn: chartPixelFn
    });
    chartLayer._filename = filename;
    chartLayer._fileMB   = fileMB;

    chartLayer.addTo(map);

    progBar.style.width = '100%';
    await new Promise(r => setTimeout(r, 300));
    progWrap.classList.remove('visible');
    statusEl.textContent = prevStatus;

    buildLayersControl();

  } catch(err) {
    console.error('Chart load error:', err);
    progWrap.classList.remove('visible');
    statusEl.textContent = prevStatus;
    console.warn('Could not auto-load chart:', err.message);
  }
}

async function loadLocalChart() {
  let fileHandle;
  try {
    [fileHandle] = await window.showOpenFilePicker({
      types: [{ description: 'GeoTIFF chart', accept: { 'image/tiff': ['.tif', '.tiff'] } }],
      multiple: false
    });
  } catch(e) { return; }

  const statusEl  = document.getElementById('load-status');
  const progWrap  = document.getElementById('progress-wrap');
  const progBar   = document.getElementById('progress-bar');
  const progLabel = document.getElementById('progress-label');
  const prevStatus = statusEl.textContent;

  statusEl.textContent = '';
  progWrap.classList.add('visible');
  progBar.style.width = '10%';
  progLabel.textContent = 'Reading chart…';

  try {
    const file = await fileHandle.getFile();
    const fileMB = (file.size / 1024 / 1024).toFixed(1);

    // Warn if very large and not a COG
    const isCOG = file.name.toLowerCase().includes('cog');
    if (file.size > 50 * 1024 * 1024 && !isCOG) {
      const proceed = confirm(
        `This file is ${fileMB} MB. Large un-pyramided TIFFs render slowly.\n\n` +
        `For best performance, convert it to a COG first using:\n` +
        `  python convert_to_cog.py "${file.name}"\n\n` +
        `Load anyway?`
      );
      if (!proceed) {
        progWrap.classList.remove('visible');
        statusEl.textContent = prevStatus;
        return;
      }
    }

    progBar.style.width = '30%';
    progLabel.textContent = `Loading ${fileMB} MB…`;
    await new Promise(r => setTimeout(r, 0));  // let UI update

    const arrayBuffer = await file.arrayBuffer();

    progBar.style.width = '60%';
    progLabel.textContent = 'Parsing GeoTIFF…';
    await new Promise(r => setTimeout(r, 0));

    const georaster = await parseGeoraster(arrayBuffer);

    progBar.style.width = '85%';
    progLabel.textContent = 'Building layer…';
    await new Promise(r => setTimeout(r, 0));

    if (chartLayer) map.removeLayer(chartLayer);

    chartGeoRaster = georaster;
    const tileRes  = file.size > 30 * 1024 * 1024 ? 128 : 256;

    chartLayer = new GeoRasterLayer({
      georaster,
      opacity: 1,
      resolution: tileRes,
      pixelValuesToColorFn: chartPixelFn
    });
    chartLayer._filename = file.name;
    chartLayer._fileMB   = fileMB;

    chartLayer.addTo(map);
    map.fitBounds(chartLayer.getBounds());

    progBar.style.width = '100%';
    await new Promise(r => setTimeout(r, 300));
    progWrap.classList.remove('visible');
    statusEl.textContent = prevStatus;

    buildLayersControl();

  } catch(err) {
    console.error('Chart load error:', err);
    progWrap.classList.remove('visible');
    statusEl.textContent = prevStatus;
    alert('Could not load chart: ' + err.message);
  }
}

// ── Utilities ─────────────────────────────────────────────────────
const fmtDate     = ms => new Date(ms).toLocaleDateString('en-CA', { year:'numeric', month:'short', day:'numeric' });
const fmtTime     = ms => new Date(ms).toLocaleTimeString('en-CA', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
const fmtDateTime = ms => new Date(ms).toLocaleDateString('en-CA', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
const fmtDuration = ms => { const m = Math.round(ms/60000); return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${m%60}m`; };
const fmtDateInput= ms => new Date(ms).toISOString().slice(0,10);

// ── GPX Parsing ───────────────────────────────────────────────────
function parseGPX(text, filename) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const ns  = 'http://www.topografix.com/GPX/1/1';

  let trkpts = Array.from(doc.getElementsByTagNameNS(ns, 'trkpt'));
  if (!trkpts.length) trkpts = Array.from(doc.getElementsByTagName('trkpt'));
  if (!trkpts.length) return null;

  const raw = [];
  for (const pt of trkpts) {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const tel = pt.getElementsByTagNameNS(ns,'time')[0] || pt.getElementsByTagName('time')[0];
    if (!tel) continue;
    const t = new Date(tel.textContent.trim().replace(' ','T').replace(/Z?$/,'Z')).getTime();
    if (!isNaN(lat) && !isNaN(lon) && !isNaN(t)) raw.push({ time:t, lat, lon });
  }
  if (raw.length < 2) return null;
  raw.sort((a,b) => a.time - b.time);

  // Compute raw speed (m/s → knots) between consecutive points
  raw[0].speed = 0;
  for (let i = 1; i < raw.length; i++) {
    const dt = (raw[i].time - raw[i-1].time) / 1000;
    const dist = haversine(raw[i-1].lat, raw[i-1].lon, raw[i].lat, raw[i].lon);
    raw[i].speed = dt > 0 ? (dist / dt) * 1.94384 : 0;
  }

  // 5-point moving-average smooth
  const W = 2;
  const points = raw.map((p, i) => {
    const s = Math.max(0, i-W), e = Math.min(raw.length-1, i+W);
    const avg = raw.slice(s, e+1).reduce((acc,r) => acc + r.speed, 0) / (e - s + 1);
    return { time:p.time, lat:p.lat, lon:p.lon, speed: Math.max(0, avg) };
  });

  return {
    id: filename,
    filename,
    startTime: points[0].time,
    endTime:   points[points.length-1].time,
    duration:  points[points.length-1].time - points[0].time,
    points,
    polylines: [],   // array of L.polyline (coloured segments)
    visible: true
  };
}

// ── Build coloured segments ───────────────────────────────────────
function buildSegments(points) {
  // Group consecutive points into runs of the same speed bucket.
  // Adjacent segments share an endpoint to avoid visible gaps.
  const segs = [];
  let curBucket = speedBucket(points[0].speed);
  let curPts    = [[points[0].lat, points[0].lon]];

  for (let i = 1; i < points.length; i++) {
    const b = speedBucket(points[i].speed);
    curPts.push([points[i].lat, points[i].lon]);

    if (b !== curBucket) {
      segs.push({ bucket: curBucket, latlngs: curPts });
      curBucket = b;
      curPts = [[points[i].lat, points[i].lon]];  // overlap
    }
  }
  segs.push({ bucket: curBucket, latlngs: curPts });
  return segs;
}

// ── Interpolation ─────────────────────────────────────────────────
function interpolate(track, t) {
  const pts = track.points;
  if (t <= pts[0].time)            return pts[0];
  if (t >= pts[pts.length-1].time) return pts[pts.length-1];
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) { const m = (lo+hi)>>1; if (pts[m].time <= t) lo=m; else hi=m; }
  const p1 = pts[lo], p2 = pts[hi];
  const f  = (t - p1.time) / (p2.time - p1.time);
  const brg = (p1.lat !== p2.lat || p1.lon !== p2.lon)
    ? bearingDeg(p1.lat, p1.lon, p2.lat, p2.lon) : 0;
  return {
    lat:     p1.lat   + f*(p2.lat   - p1.lat),
    lon:     p1.lon   + f*(p2.lon   - p1.lon),
    speed:   p1.speed + f*(p2.speed - p1.speed),
    bearing: brg
  };
}

// ── Load folder ───────────────────────────────────────────────────
// Fetch and parse GPX files that fall within [fromMs, toMs] and aren't loaded yet
// Convert a compact JSON track object into the app's track format
function trackFromJSON({id, s, e, bbox, pts}) {
  return {
    id, filename: id,
    startTime: s, endTime: e, duration: e - s,
    bbox: { minLat: bbox[0], minLon: bbox[1], maxLat: bbox[2], maxLon: bbox[3] },
    points: pts.map(([lat, lon, time, speed]) => ({lat, lon, time, speed})),
    polylines: [], visible: true, shown: true
  };
}

// True if track's bbox intersects Leaflet LatLngBounds
function bboxIntersects(track, bounds) {
  if (!track.bbox) return true;
  return track.bbox.maxLat >= bounds.getSouth() &&
         track.bbox.minLat <= bounds.getNorth() &&
         track.bbox.maxLon >= bounds.getWest()  &&
         track.bbox.minLon <= bounds.getEast();
}

async function loadTracksForRange(fromMs, toMs) {
  const spatialOn = document.getElementById('chk-spatial')?.checked;
  const bounds    = spatialOn ? map.getBounds() : null;

  // Determine which months need fetching
  const neededMonths = new Set(
    allTrackMeta
      .filter(m => {
        if (m.startMs < fromMs || m.startMs > toMs) return false;
        if (loadedMonths.has(m.month)) return false;
        // Spatial pre-filter using manifest bbox
        if (bounds && m.bbox) {
          const [mnLat, mnLon, mxLat, mxLon] = m.bbox;
          if (mxLat < bounds.getSouth() || mnLat > bounds.getNorth() ||
              mxLon < bounds.getWest()  || mnLon > bounds.getEast()) return false;
        }
        return true;
      })
      .map(m => m.month)
  );

  if (!neededMonths.size) return;

  const monthList = [...neededMonths].sort();
  const progWrap  = document.getElementById('progress-wrap');
  const progBar   = document.getElementById('progress-bar');
  const progLabel = document.getElementById('progress-label');
  progWrap.classList.add('visible');
  progBar.style.width = '0%';

  let done = 0;
  for (const month of monthList) {
    progLabel.textContent = `Loading ${month}…`;
    try {
      const r = await fetch(`data/${month}.json`);
      if (!r.ok) throw new Error(r.status);
      const monthTracks = await r.json();
      for (const t of monthTracks) {
        if (!loadedFiles.has(t.id)) {
          tracks.push(trackFromJSON(t));
          loadedFiles.add(t.id);
        }
      }
    } catch(e) { console.warn(`Failed to load data/${month}.json:`, e); }
    loadedMonths.add(month);
    done++;
    progBar.style.width = Math.round(done / monthList.length * 100) + '%';
    await new Promise(r => setTimeout(r, 0));
  }

  tracks.sort((a,b) => a.startTime - b.startTime);
  progBar.style.width = '100%';
  await new Promise(r => setTimeout(r, 200));
  progWrap.classList.remove('visible');
  document.getElementById('load-status').textContent =
    `${loadedFiles.size} / ${allTrackMeta.length} tracks loaded`;
}

async function autoLoadTracks() {
  const splashStatus = document.getElementById('splash-status');

  // 1. Fetch manifest (metadata only — no GPX files yet)
  try {
    const r = await fetch('tracks.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    allTrackMeta = await r.json(); // [{file, startMs}]
  } catch(e) {
    if (splashStatus) splashStatus.textContent = 'Could not load track index: ' + e.message;
    return;
  }

  // 2. Set default date range: latest 7 days in the dataset
  const latestMs = Math.max(...allTrackMeta.map(m => m.startMs));
  const weekAgo  = latestMs - 7 * 24 * 60 * 60 * 1000;
  document.getElementById('date-from').value = fmtDateInput(weekAgo);
  document.getElementById('date-to').value   = fmtDateInput(latestMs);

  // 3. Load only tracks in that window
  if (splashStatus) splashStatus.textContent = 'Loading recent tracks…';
  await loadTracksForRange(weekAgo, latestMs);

  document.getElementById('splash').classList.add('hidden');
  applyFilter();

  // 4. Auto-load the bundled chart as an overlay
  loadChartFromUrl(DEFAULT_CHART_URL);
}

// ── Filter ────────────────────────────────────────────────────────
function localHHMM(ms) {
  // Returns "HH:MM" in local browser time (Eastern if OS is set to ET)
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function applyFilter() {
  const fromMs = document.getElementById('date-from').value
    ? new Date(document.getElementById('date-from').value + 'T00:00:00').getTime() : 0;
  const toMs   = document.getElementById('date-to').value
    ? new Date(document.getElementById('date-to').value   + 'T23:59:59').getTime() : Infinity;

  const timeFrom = document.getElementById('time-from').value; // "HH:MM" or ""
  const timeTo   = document.getElementById('time-to').value;   // "HH:MM" or ""

  const spatialOn = document.getElementById('chk-spatial')?.checked;
  const bounds    = spatialOn ? map.getBounds() : null;

  selectedTrack = null;
  visibleTracks = tracks.filter(t => {
    // Date range check
    if (t.startTime > toMs || t.endTime < fromMs) return false;

    // Time-of-day check (applied to track start time, local browser time)
    if (timeFrom && timeTo) {
      const hhmm = localHHMM(t.startTime);
      if (timeFrom <= timeTo) {
        if (hhmm < timeFrom || hhmm > timeTo) return false;
      } else {
        if (hhmm < timeFrom && hhmm > timeTo) return false;
      }
    }

    // Spatial check — only if "Limit to map view" is checked
    if (bounds && !bboxIntersects(t, bounds)) return false;

    return true;
  });
  renderTracks();
  updateSidebar();
  updateAnimRange();
}

// ── Render coloured tracks ────────────────────────────────────────
function renderTracks() {
  trackLayer.clearLayers();
  markerLayer.clearLayers();

  for (const track of visibleTracks) {
    track.polylines = [];
    const segs = buildSegments(track.points);

    for (const seg of segs) {
      if (seg.latlngs.length < 2) continue;
      const pl = L.polyline(seg.latlngs, {
        color:   SPEED_COLORS[seg.bucket],
        weight:  2.5,
        opacity: 0.75
      }).addTo(trackLayer);
      pl.on('click', () => zoomToTrack(track));
      track.polylines.push(pl);
    }
  }

  if (visibleTracks.length) {
    const group = L.featureGroup(visibleTracks.flatMap(t => t.polylines));
    if (group.getLayers().length) map.fitBounds(group.getBounds().pad(0.05));
  }
}

function zoomToTrack(track) {
  if (!track.polylines.length) return;
  const g = L.featureGroup(track.polylines);
  map.fitBounds(g.getBounds().pad(0.1));
}

// ── Sidebar ───────────────────────────────────────────────────────
function updateSidebar() {
  const list    = document.getElementById('tracklist');
  const countEl = document.getElementById('tracklist-count');
  const summary = document.getElementById('track-summary');

  countEl.textContent = `${visibleTracks.length} of ${tracks.length}`;

  if (!visibleTracks.length) {
    list.innerHTML = '<div id="no-tracks">No tracks in this date range.</div>';
    summary.textContent = '';
    return;
  }

  const totalDur = visibleTracks.reduce((s,t) => s + t.duration, 0);
  summary.textContent = `Total: ${fmtDuration(totalDur)} · ${visibleTracks.length} track${visibleTracks.length!==1?'s':''}`;

  list.innerHTML = '';
  for (const track of visibleTracks) {
    const el   = document.createElement('div');
    el.className  = 'track-item';
    el.dataset.id = track.id;

    const maxSpd = Math.max(...track.points.map(p => p.speed));
    if (track.shown === undefined) track.shown = true;

    el.innerHTML = `
      <input type="checkbox" class="track-cb" ${track.shown ? 'checked' : ''} title="Show/hide track">
      <div class="track-dot"></div>
      <div class="track-info">
        <div class="track-date">${fmtDateTime(track.startTime)}</div>
        <div class="track-meta">${fmtTime(track.startTime)} · ${fmtDuration(track.duration)} · max ${maxSpd.toFixed(1)} kts</div>
      </div>
      <button class="track-zoom" title="Zoom to track">⊕</button>
    `;
    if (!track.shown) el.classList.add('track-hidden');

    if (selectedTrack === track) el.classList.add('track-selected');

    el.querySelector('.track-cb').onchange = e => {
      e.stopPropagation();
      setTrackShown(track, e.target.checked);
    };
    el.querySelector('.track-zoom').onclick = e => { e.stopPropagation(); zoomToTrack(track); };
    el.onclick = () => {
      stopAnim();
      if (selectedTrack === track) {
        // Deselect — revert to full range
        selectedTrack = null;
      } else {
        selectedTrack = track;
        zoomToTrack(track);
      }
      // Refresh selected highlight across all items
      document.querySelectorAll('.track-item').forEach(el => el.classList.remove('track-selected'));
      if (selectedTrack) el.classList.add('track-selected');
      updateAnimRange();
      setAnimTime(animMin);
      updateSlider(); updateTimeDisplay(); updateMarkers();
    };
    list.appendChild(el);
  }
}

// ── Animation range ───────────────────────────────────────────────
function updateAnimRange() {
  const slider = document.getElementById('anim-slider');
  if (!visibleTracks.length) {
    slider.disabled = true;
    document.getElementById('anim-range-start').textContent = '──';
    document.getElementById('anim-range-end').textContent   = '──';
    updateTimeDisplay(); return;
  }

  if (selectedTrack) {
    animMin = selectedTrack.startTime;
    animMax = selectedTrack.endTime;
    document.getElementById('anim-range-start').textContent = fmtTime(animMin);
    document.getElementById('anim-range-end').textContent   = fmtTime(animMax);
  } else {
    animMin = Math.min(...visibleTracks.map(t => t.startTime));
    animMax = Math.max(...visibleTracks.map(t => t.endTime));
    document.getElementById('anim-range-start').textContent = fmtDate(animMin);
    document.getElementById('anim-range-end').textContent   = fmtDate(animMax);
  }

  slider.min  = animMin;
  slider.max  = animMax;
  slider.step = Math.max(1, Math.round((animMax - animMin) / 10000));
  slider.disabled = false;
  if (animTime < animMin || animTime > animMax) setAnimTime(animMin);
  slider.value = animTime;
  updateTimeDisplay();
}

function setAnimTime(t) { animTime = Math.max(animMin, Math.min(animMax, t)); }

// ── Time display ──────────────────────────────────────────────────
function updateTimeDisplay() {
  const main  = document.getElementById('anim-time-main');
  const sub   = document.getElementById('anim-time-sub');
  const count = document.getElementById('active-count');
  if (!visibleTracks.length) {
    main.textContent  = '──────────────';
    sub.textContent   = 'No tracks loaded';
    count.textContent = ''; return;
  }
  main.textContent = fmtDateTime(animTime);
  sub.textContent  = fmtTime(animTime);
  const active = visibleTracks.filter(t => animTime >= t.startTime && animTime <= t.endTime);
  count.textContent = active.length ? `${active.length} track${active.length!==1?'s':''} active` : '';
}

// ── Toggle individual track visibility ────────────────────────────
function setTrackShown(track, shown) {
  track.shown = shown;
  const opacity = shown ? null : 0;  // null = restore anim-driven opacity
  for (const pl of track.polylines) {
    pl.setStyle({ opacity: shown ? 0.75 : 0, weight: shown ? 2.5 : 0 });
  }
  const el = document.querySelector(`.track-item[data-id="${CSS.escape(track.id)}"]`);
  if (el) {
    el.classList.toggle('track-hidden', !shown);
    const cb = el.querySelector('.track-cb');
    if (cb) cb.checked = shown;
  }
  updateMarkers();
}

// ── Animated markers + speed callout ─────────────────────────────
function updateMarkers() {
  markerLayer.clearLayers();

  // Reset all polyline opacity (skip hidden tracks)
  for (const track of visibleTracks) {
    if (!track.shown) continue;
    const isActive = animTime >= track.startTime && animTime <= track.endTime;
    for (const pl of track.polylines) {
      pl.setStyle({ opacity: isActive ? 0.9 : 0.25, weight: isActive ? 3 : 2 });
    }
    const el = document.querySelector(`.track-item[data-id="${CSS.escape(track.id)}"]`);
    if (el) {
      el.classList.toggle('active-now', isActive);
      const dot = el.querySelector('.track-dot');
      if (dot) dot.style.background = isActive ? '#f38ba8' : '#89b4fa';
    }
  }

  // Place animated marker + speed callout for each active track
  for (const track of visibleTracks) {
    if (!track.shown) continue;
    if (animTime < track.startTime || animTime > track.endTime) continue;
    const pos   = interpolate(track, animTime);
    const color = SPEED_COLORS[speedBucket(pos.speed)];
    const spd   = pos.speed.toFixed(1);

    const icon = L.divIcon({
      className: '',
      iconSize:  [70, 78],
      iconAnchor:[35, 60],
      html: `
        <div class="speed-callout-wrap">
          <div class="speed-callout">
            <span>${spd}</span>
            <span class="kts-label"> kts</span>
          </div>
          <div class="speed-callout-stem"></div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="-11 -18 22 36" width="22" height="36"
               style="transform:rotate(${pos.bearing.toFixed(1)}deg);transform-origin:50% 50%;
                      display:block;margin:0 auto;overflow:visible;
                      filter:drop-shadow(0 1px 3px rgba(0,0,0,0.85))">
            <!-- Hull: bow at top (-y), stern at bottom (+y) -->
            <path d="M0,-17 C7,-10 8,0 7,10 Q0,16 -7,10 C-8,0 -7,-10 0,-17Z"
                  fill="${color}" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
            <!-- Mast -->
            <circle cx="0" cy="-4" r="1.8" fill="white" opacity="0.95"/>
            <!-- Mainsail (starboard) -->
            <path d="M0,-4 L8,9 L0,9Z" fill="white" fill-opacity="0.55"/>
            <!-- Jib (port) -->
            <path d="M0,-4 L-6,4 L0,1Z" fill="white" fill-opacity="0.38"/>
          </svg>
        </div>`
    });

    L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 }).addTo(markerLayer);
  }
}

function updateSlider() { document.getElementById('anim-slider').value = animTime; }

// ── Animation loop ────────────────────────────────────────────────
function animStep(realNow) {
  if (!isPlaying) return;
  if (lastRealTime !== null) {
    const trackDelta = (realNow - lastRealTime) * animSpeed / 1000;
    setAnimTime(animTime + trackDelta);
    updateSlider(); updateTimeDisplay(); updateMarkers();
    if (animTime >= animMax) { stopAnim(); return; }
  }
  lastRealTime = realNow;
  rafId = requestAnimationFrame(animStep);
}

function startAnim() {
  if (!visibleTracks.length) return;
  isPlaying = true; lastRealTime = null;
  document.getElementById('btn-play').textContent = '⏸';
  if (animTime >= animMax) setAnimTime(animMin);
  rafId = requestAnimationFrame(animStep);
}

function stopAnim() {
  isPlaying = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  document.getElementById('btn-play').textContent = '▶';
  lastRealTime = null;
}

const togglePlay = () => isPlaying ? stopAnim() : startAnim();

// ── Wiring ────────────────────────────────────────────────────────
// Auto-load tracks on startup
autoLoadTracks();
document.getElementById('btn-apply').onclick   = async () => {
  const fromMs = document.getElementById('date-from').value
    ? new Date(document.getElementById('date-from').value + 'T00:00:00').getTime() : 0;
  const toMs   = document.getElementById('date-to').value
    ? new Date(document.getElementById('date-to').value   + 'T23:59:59').getTime() : Infinity;
  await loadTracksForRange(fromMs, toMs);
  applyFilter();
};
document.getElementById('btn-showall').onclick = () => {
  if (!tracks.length) return;
  document.getElementById('date-from').value = fmtDateInput(tracks[0].startTime);
  document.getElementById('date-to').value   = fmtDateInput(tracks[tracks.length-1].startTime);
  document.getElementById('time-from').value = '';
  document.getElementById('time-to').value   = '';
  applyFilter();
};
document.getElementById('btn-all').onclick  = () => { visibleTracks.forEach(t => setTrackShown(t, true));  };
document.getElementById('btn-none').onclick = () => { visibleTracks.forEach(t => setTrackShown(t, false)); };
document.getElementById('btn-play').onclick      = togglePlay;
document.getElementById('btn-to-start').onclick  = () => { stopAnim(); setAnimTime(animMin); updateSlider(); updateTimeDisplay(); updateMarkers(); };
document.getElementById('btn-to-end').onclick    = () => { stopAnim(); setAnimTime(animMax); updateSlider(); updateTimeDisplay(); updateMarkers(); };
document.getElementById('btn-step-back').onclick = () => { stopAnim(); setAnimTime(animTime-60000); updateSlider(); updateTimeDisplay(); updateMarkers(); };
document.getElementById('btn-step-fwd').onclick  = () => { stopAnim(); setAnimTime(animTime+60000); updateSlider(); updateTimeDisplay(); updateMarkers(); };
document.getElementById('anim-slider').oninput   = e => { stopAnim(); setAnimTime(parseInt(e.target.value)); updateTimeDisplay(); updateMarkers(); };
document.getElementById('speed-select').onchange = e => { animSpeed = parseInt(e.target.value); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft')  { stopAnim(); setAnimTime(animTime-60000);  updateSlider(); updateTimeDisplay(); updateMarkers(); }
  if (e.code === 'ArrowRight') { stopAnim(); setAnimTime(animTime+60000);  updateSlider(); updateTimeDisplay(); updateMarkers(); }
  if (e.code === 'Home')       { stopAnim(); setAnimTime(animMin); updateSlider(); updateTimeDisplay(); updateMarkers(); }
  if (e.code === 'End')        { stopAnim(); setAnimTime(animMax); updateSlider(); updateTimeDisplay(); updateMarkers(); }
});
</script>
</body>
</html>
